<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 480" width="512" height="480" role="img" aria-label="KOOK 로고">
  <title>KOOK</title>
  <defs>
    <linearGradient id="kookSoup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#efe4c6"/>
      <stop offset="100%" stop-color="#ded0aa"/>
    </linearGradient>
    <linearGradient id="kookPot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#584231"/>
      <stop offset="100%" stop-color="#3a2b1f"/>
    </linearGradient>
  </defs>

  <!-- 김(steam): 국물 위로 올라가는 초록 연기 두 줄기 -->
  <g fill="none" stroke="#9db878" stroke-width="11" stroke-linecap="round" opacity=".92">
    <path d="M300 250 C 288 214 314 196 306 164 C 300 138 316 122 314 96"/>
    <path d="M348 252 C 338 216 362 198 356 168 C 350 142 366 126 364 100"/>
  </g>

  <!-- 뚝배기 몸통 -->
  <path d="M196 258 h224 c0 0 -6 106 -34 132 c-20 20 -60 26 -78 26 s-58 -6 -78 -26 c-28 -26 -34 -132 -34 -132 z" fill="url(#kookPot)"/>
  <!-- 손잡이 -->
  <path d="M196 276 c-26 -2 -34 12 -34 26 s10 26 34 24" fill="none" stroke="#4a3728" stroke-width="18" stroke-linecap="round"/>
  <path d="M420 276 c26 -2 34 12 34 26 s-10 26 -34 24" fill="none" stroke="#4a3728" stroke-width="18" stroke-linecap="round"/>
  <!-- 국물 -->
  <ellipse cx="308" cy="260" rx="112" ry="30" fill="#4a3728"/>
  <ellipse cx="308" cy="258" rx="100" ry="24" fill="url(#kookSoup)"/>
  <!-- 두부 두 조각 -->
  <g fill="#faf6e8" stroke="#e0d3ae" stroke-width="2">
    <rect x="266" y="242" width="34" height="24" rx="4"/>
    <rect x="318" y="248" width="30" height="21" rx="4"/>
  </g>
  <!-- 파 고명 -->
  <g fill="#7d9c4d">
    <circle cx="252" cy="264" r="7"/><circle cx="360" cy="262" r="7"/><circle cx="300" cy="272" r="6"/>
  </g>
  <g fill="#efe4c6">
    <circle cx="252" cy="264" r="3"/><circle cx="360" cy="262" r="3"/><circle cx="300" cy="272" r="2.5"/>
  </g>
  <!-- 미나리 잎 -->
  <g fill="#5d8a39">
    <ellipse cx="338" cy="238" rx="13" ry="7" transform="rotate(-24 338 238)"/>
    <ellipse cx="356" cy="244" rx="11" ry="6" transform="rotate(14 356 244)"/>
  </g>

  <!-- 붓글씨 '쿡' -->
  <text x="20" y="300" font-family="'Nanum Brush Script','HY견고딕','Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="250" font-weight="800" fill="#3d2e22">쿡</text>

  <!-- 낙관(붉은 도장) -->
  <rect x="416" y="330" width="58" height="58" rx="7" fill="#c0392b"/>
  <text x="445" y="374" text-anchor="middle" font-family="'Malgun Gothic','Noto Sans KR',sans-serif"
        font-size="34" font-weight="700" fill="#fff">쿡</text>

  <!-- KOOK 워드마크 -->
  <text x="256" y="458" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="70" font-weight="600" letter-spacing="10" fill="#3d2e22">KOOK</text>
</svg>
